<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Room — PadhleBeta</title>
    <meta name="theme-color" content="#08080d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Yatra+One&display=swap"
    />
    <link rel="stylesheet" href="/ambient.css" />
    <link rel="stylesheet" href="/rooms/rooms.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__blob ambient__blob--1"></div>
      <div class="ambient__blob ambient__blob--2"></div>
      <div class="ambient__blob ambient__blob--3"></div>
      <div class="ambient__grain"></div>
    </div>
    <div class="shell">
      <a class="back" href="/">← Back to PadhleBeta</a>

      <h1 class="page-title">Study Room</h1>
      <p class="page-sub">Join in and study alongside others, live. No mic, no camera — just quiet company and chat during breaks.</p>

      <div class="studied-badge" id="studiedBadge" hidden>
        📚 Studied so far: <strong id="studiedAmount">0m</strong>
      </div>

      <div class="name-card">
        <label for="nameInput">Your name</label>
        <div class="name-row">
          <input id="nameInput" type="text" placeholder="e.g. Aarav" maxlength="24" autocomplete="off" />
          <button id="randomNameBtn" type="button" title="Get a random name">🎲 Random</button>
        </div>
      </div>

      <a class="join-card" href="/rooms/room.html?room=lakshya" id="joinCard">
        <span class="join-card__icon">🎯</span>
        <span class="join-card__text">
          <span class="join-card__title">Lakshya · Open Focus</span>
          <span class="join-card__count"><span class="dot"></span><span id="liveCount">— studying now</span></span>
        </span>
        <span class="join-card__arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 5l7 7-7 7"></path></svg>
        </span>
      </a>
    </div>

    <script src="/ambient.js"></script>
    <script src="/rooms/config.js"></script>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const room = ROOMS[0];

      const nameInput = document.getElementById('nameInput');
      nameInput.value = getStudentName();
      nameInput.addEventListener('input', () => setStudentName(nameInput.value, 'custom'));

      document.getElementById('randomNameBtn').addEventListener('click', () => {
        const name = randomName();
        nameInput.value = name;
        setStudentName(name, 'random');
      });

      const studiedSeconds = getStudiedSeconds();
      if (studiedSeconds > 0) {
        document.getElementById('studiedBadge').hidden = false;
        document.getElementById('studiedAmount').textContent = formatDuration(studiedSeconds);
      }

      const joinCard = document.getElementById('joinCard');
      joinCard.addEventListener('click', (e) => {
        if (!nameInput.value.trim()) {
          e.preventDefault();
          nameInput.focus();
          nameInput.placeholder = 'Enter your name first';
        } else {
          setStudentName(nameInput.value, getStudentNameType());
        }
      });

      // Best-effort live headcount.
      const liveCount = document.getElementById('liveCount');
      const channel = supabase.channel(`room:${room.id}`, {
        config: { presence: { key: `peek-${Math.random().toString(36).slice(2)}` } },
      });
      channel.on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        const n = Object.values(state).flat().length;
        liveCount.textContent = n === 1 ? '1 studying now' : `${n} studying now`;
      });
      channel.subscribe();

      // Log a page view — fire-and-forget, never blocks the UI. user_id is
      // left out here since pb_users only gets a row once someone actually
      // joins a room (the FK would otherwise fail for first-time visitors).
      supabase.from('pb_events').insert({
        device_session_id: getDeviceSessionId(),
        event_name: 'rooms_page_view',
        properties: {},
      }).then(() => {}, () => {});
    </script>
  </body>
</html>
