<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Rooms — PadhleBeta</title>
    <meta name="theme-color" content="#0a1430" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Yatra+One&display=swap"
    />
    <link rel="stylesheet" href="/rooms/rooms.css" />
  </head>
  <body>
    <div class="shell">
      <a class="back" href="/">← Back to PadhleBeta</a>

      <h1 class="page-title">Study Rooms</h1>
      <p class="page-sub">Pick your batch, join in, and study alongside others. No mic, no camera — just quiet company and chat.</p>

      <div class="studied-badge" id="studiedBadge" hidden>
        📚 Studied so far: <strong id="studiedAmount">0m</strong>
      </div>

      <div class="name-card">
        <label for="nameInput">Your name</label>
        <input id="nameInput" type="text" placeholder="e.g. Aarav" maxlength="24" autocomplete="off" />
      </div>

      <div id="roomGroups"></div>
    </div>

    <script src="/rooms/config.js"></script>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const nameInput = document.getElementById('nameInput');
      nameInput.value = getStudentName();
      nameInput.addEventListener('input', () => setStudentName(nameInput.value));

      const studiedSeconds = getStudiedSeconds();
      if (studiedSeconds > 0) {
        document.getElementById('studiedBadge').hidden = false;
        document.getElementById('studiedAmount').textContent = formatDuration(studiedSeconds);
      }

      const groupsEl = document.getElementById('roomGroups');
      const groups = [...new Set(ROOMS.map((r) => r.group))];
      const cardByRoom = {};

      groups.forEach((group) => {
        const heading = document.createElement('div');
        heading.className = 'room-group';
        heading.textContent = group;
        groupsEl.append(heading);

        const grid = document.createElement('div');
        grid.className = 'room-grid';

        ROOMS.filter((r) => r.group === group).forEach((room) => {
          const card = document.createElement('a');
          card.className = 'room-card';
          card.href = `/rooms/room.html?room=${room.id}`;
          card.addEventListener('click', (e) => {
            if (!nameInput.value.trim()) {
              e.preventDefault();
              nameInput.focus();
              nameInput.placeholder = 'Enter your name first';
            } else {
              setStudentName(nameInput.value);
            }
          });

          const label = document.createElement('span');
          label.className = 'room-card__label';
          label.textContent = room.label;

          const count = document.createElement('span');
          count.className = 'room-card__count';
          count.innerHTML = '<span class="dot"></span><span>—</span>';

          card.append(label, count);
          grid.append(card);
          cardByRoom[room.id] = count.querySelector('span:last-child');
        });

        groupsEl.append(grid);
      });

      // Best-effort live headcounts for the picker — subscribe briefly to
      // each room's presence channel just to read the count, then let it go.
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      ROOMS.forEach((room) => {
        const channel = supabase.channel(`room:${room.id}`, {
          config: { presence: { key: `peek-${Math.random().toString(36).slice(2)}` } },
        });
        channel.on('presence', { event: 'sync' }, () => {
          const state = channel.presenceState();
          const n = Object.values(state).flat().length;
          const el = cardByRoom[room.id];
          if (el) el.textContent = n === 1 ? '1 studying' : `${n} studying`;
        });
        channel.subscribe();
      });
    </script>
  </body>
</html>
