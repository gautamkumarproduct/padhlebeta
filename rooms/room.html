<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Room — PadhleBeta</title>
    <meta name="theme-color" content="#0a1430" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Yatra+One&display=swap"
    />
    <link rel="stylesheet" href="/rooms/rooms.css" />
  </head>
  <body>
    <div class="shell room-shell">
      <a class="back" href="/rooms/">← All rooms</a>

      <div class="room-header">
        <h1 id="roomTitle">Study Room</h1>
        <span class="count"><span class="dot"></span><span id="roomCount">1 studying</span></span>
      </div>

      <div class="pomodoro-card" id="pomodoroCard">
        <div class="pomodoro-phase" id="pomodoroPhase">FOCUS</div>
        <div class="pomodoro-timer" id="pomodoroTimer">30:00</div>
        <div class="pomodoro-label" id="pomodoroLabel">until break</div>
      </div>

      <div class="timer-card">
        <div class="timer" id="timer">00:00</div>
        <div class="timer-label">your time in this room</div>
        <button class="leave-btn" id="leaveBtn" type="button">Leave room</button>
      </div>

      <div class="poll-card is-hidden" id="pollCard">
        <div class="poll-question">Did you focus for the last 30 minutes — a serious study block?</div>
        <div class="poll-options">
          <button class="poll-btn" data-response="yes" type="button">💪 Yes</button>
          <button class="poll-btn" data-response="partial" type="button">😐 Kinda</button>
          <button class="poll-btn" data-response="no" type="button">😴 No</button>
        </div>
        <div class="poll-results" id="pollResults"></div>
      </div>

      <div class="present">
        <div class="room-group">In this room</div>
        <div class="present-list" id="presentList"></div>
      </div>

      <div class="chat-toggle">
        <div class="room-group" style="margin: 0">Chat</div>
        <button id="chatToggleBtn" type="button">Hide chat</button>
      </div>

      <div class="chat-panel" id="chatPanel">
        <div class="chat-log" id="chatLog">
          <p class="chat-empty" id="chatLockedMsg">🔒 Chat opens during the next break</p>
        </div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" type="text" placeholder="Chat opens on break…" maxlength="240" autocomplete="off" disabled />
          <button type="submit" id="chatSendBtn" disabled>Send</button>
        </form>
      </div>
    </div>

    <script src="/rooms/config.js"></script>
    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const params = new URLSearchParams(location.search);
      const room = getRoomById(params.get('room'));
      const name = getStudentName();

      if (!room || !name) {
        location.href = '/rooms/';
        throw new Error('redirecting: missing room or name');
      }

      document.getElementById('roomTitle').textContent = room.title;

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const deviceId = getDeviceId();
      const myKey = `${name}-${Math.random().toString(36).slice(2, 8)}`;

      // ── Identity + session logging ─────────────────────────────────
      supabase.from('pb_users').upsert(
        { id: deviceId, display_name: name, name_type: getStudentNameType(), last_seen_at: new Date().toISOString() },
        { onConflict: 'id' },
      ).then(() => {}, () => {});

      const sessionId = crypto.randomUUID();
      supabase.from('pb_room_sessions').insert({
        id: sessionId,
        user_id: deviceId,
        room_id: room.id,
        joined_at: new Date().toISOString(),
      }).then(() => {}, () => {});

      supabase.from('pb_events').insert({
        user_id: deviceId,
        device_session_id: getDeviceSessionId(),
        event_name: 'room_join',
        room_id: room.id,
        properties: { name_type: getStudentNameType() },
      }).then(() => {}, () => {});

      // ── Presence + chip list ─────────────────────────────────────────
      const channel = supabase.channel(`room:${room.id}`, {
        config: { presence: { key: myKey }, broadcast: { self: true } },
      });

      const presentList = document.getElementById('presentList');
      const roomCount = document.getElementById('roomCount');

      function renderPresence() {
        const state = channel.presenceState();
        const people = Object.values(state)
          .flat()
          .sort((a, b) => a.joined_at - b.joined_at);

        roomCount.textContent = people.length === 1 ? '1 studying' : `${people.length} studying`;

        presentList.innerHTML = '';
        people.forEach((p) => {
          const chip = document.createElement('span');
          chip.className = 'present-chip' + (p.key === myKey ? ' is-you' : '');
          chip.textContent = p.key === myKey ? `${p.name} (you)` : p.name;
          presentList.append(chip);
        });
      }

      channel.on('presence', { event: 'sync' }, renderPresence);

      // ── Chat (break-only, cleared after each break) ──────────────────
      const chatLog = document.getElementById('chatLog');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const chatSendBtn = document.getElementById('chatSendBtn');
      const chatLockedMsg = document.getElementById('chatLockedMsg');

      function renderMessages(rows) {
        chatLog.innerHTML = '';
        if (!rows.length) {
          chatLog.append(chatLockedMsgClone('No messages yet — say hi 👋'));
          return;
        }
        rows.forEach((row) => {
          const msg = document.createElement('div');
          msg.className = 'chat-msg' + (row.user_id === deviceId ? ' is-you' : '');
          const who = document.createElement('span');
          who.className = 'who';
          who.textContent = row.display_name + ': ';
          const body = document.createElement('span');
          body.className = 'body';
          body.textContent = row.body;
          msg.append(who, body);
          chatLog.append(msg);
        });
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function chatLockedMsgClone(text) {
        const p = document.createElement('p');
        p.className = 'chat-empty';
        p.textContent = text;
        return p;
      }

      async function loadChatForCycle(cycleKey) {
        const { data } = await supabase
          .from('pb_chat_messages')
          .select('user_id, display_name, body')
          .eq('room_id', room.id)
          .eq('cycle_key', cycleKey)
          .order('created_at', { ascending: true })
          .limit(200);
        renderMessages(data || []);
      }

      channel.on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'pb_chat_messages', filter: `room_id=eq.${room.id}` },
        ({ new: row }) => {
          if (row.cycle_key !== cycleState.cycleKey) return;
          const empty = chatLog.querySelector('.chat-empty');
          if (empty) chatLog.innerHTML = '';
          const msg = document.createElement('div');
          msg.className = 'chat-msg' + (row.user_id === deviceId ? ' is-you' : '');
          const who = document.createElement('span');
          who.className = 'who';
          who.textContent = row.display_name + ': ';
          const body = document.createElement('span');
          body.className = 'body';
          body.textContent = row.body;
          msg.append(who, body);
          chatLog.append(msg);
          chatLog.scrollTop = chatLog.scrollHeight;
        },
      );

      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = chatInput.value.trim();
        if (!body || !cycleState.isBreak) return;
        chatInput.value = '';
        await supabase.from('pb_chat_messages').insert({
          room_id: room.id,
          user_id: deviceId,
          display_name: name,
          body,
          cycle_key: cycleState.cycleKey,
        });
      });

      function setChatLocked(locked) {
        chatInput.disabled = locked;
        chatSendBtn.disabled = locked;
        chatInput.placeholder = locked ? 'Chat opens on break…' : 'Type a message…';
      }

      // ── Chat visibility (user preference) toggle ─────────────────────
      const chatPanel = document.getElementById('chatPanel');
      const chatToggleBtn = document.getElementById('chatToggleBtn');
      let chatHidden = localStorage.getItem('pb_chat_hidden') === '1';
      function applyChatVisibility() {
        chatPanel.classList.toggle('is-hidden', chatHidden);
        chatToggleBtn.textContent = chatHidden ? 'Show chat' : 'Hide chat';
      }
      applyChatVisibility();
      chatToggleBtn.addEventListener('click', () => {
        chatHidden = !chatHidden;
        localStorage.setItem('pb_chat_hidden', chatHidden ? '1' : '0');
        applyChatVisibility();
      });

      // ── Poll ("did you focus the last 30 minutes?") ──────────────────
      const pollCard = document.getElementById('pollCard');
      const pollResults = document.getElementById('pollResults');
      let myVote = null;

      async function loadPoll(cycleKey) {
        const { data } = await supabase
          .from('pb_poll_responses')
          .select('user_id, response')
          .eq('room_id', room.id)
          .eq('cycle_key', cycleKey)
          .limit(1000);
        renderPollResults(data || []);
        const mine = (data || []).find((r) => r.user_id === deviceId);
        myVote = mine ? mine.response : null;
        highlightMyVote();
      }

      function renderPollResults(rows) {
        const counts = { yes: 0, partial: 0, no: 0 };
        rows.forEach((r) => {
          if (counts[r.response] !== undefined) counts[r.response] += 1;
        });
        const total = rows.length;
        pollResults.textContent = total
          ? `💪 ${counts.yes} · 😐 ${counts.partial} · 😴 ${counts.no} (${total} responded)`
          : 'No responses yet';
      }

      function highlightMyVote() {
        document.querySelectorAll('.poll-btn').forEach((btn) => {
          btn.classList.toggle('is-selected', btn.dataset.response === myVote);
        });
      }

      document.querySelectorAll('.poll-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const response = btn.dataset.response;
          myVote = response;
          highlightMyVote();
          await supabase.from('pb_poll_responses').upsert(
            { room_id: room.id, user_id: deviceId, cycle_key: cycleState.cycleKey, response },
            { onConflict: 'room_id,user_id,cycle_key' },
          );
          supabase.from('pb_events').insert({
            user_id: deviceId,
            device_session_id: getDeviceSessionId(),
            event_name: 'poll_answered',
            room_id: room.id,
            properties: { response, cycle_key: cycleState.cycleKey },
          }).then(() => {}, () => {});
        });
      });

      channel.on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'pb_poll_responses', filter: `room_id=eq.${room.id}` },
        (payload) => {
          const row = payload.new || payload.old;
          if (!row || row.cycle_key !== cycleState.cycleKey) return;
          loadPoll(cycleState.cycleKey);
        },
      );

      channel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await channel.track({ key: myKey, name, joined_at: Date.now() });
        }
      });

      // ── Pomodoro cycle ─────────────────────────────────────────────
      const phaseEl = document.getElementById('pomodoroPhase');
      const pomodoroTimerEl = document.getElementById('pomodoroTimer');
      const pomodoroLabelEl = document.getElementById('pomodoroLabel');
      const pomodoroCard = document.getElementById('pomodoroCard');

      let cycleState = getCycleState();
      let lastCycleKey = cycleState.cycleKey;
      let lastIsBreak = cycleState.isBreak;

      function fmtClock(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      async function enterBreak() {
        pollCard.classList.remove('is-hidden');
        pollResults.textContent = '';
        myVote = null;
        setChatLocked(false);
        await loadChatForCycle(cycleState.cycleKey);
        await loadPoll(cycleState.cycleKey);
      }

      function enterFocus(previousCycleKey) {
        pollCard.classList.add('is-hidden');
        setChatLocked(true);
        chatLog.innerHTML = '';
        chatLog.append(chatLockedMsgClone('🔒 Chat opens during the next break'));
        // Clear out the break that just ended — RLS only allows deleting
        // rows from a cycle that has already finished, so this is safe
        // even if several clients in the room all fire it at once.
        if (previousCycleKey !== undefined) {
          supabase
            .from('pb_chat_messages')
            .delete()
            .eq('room_id', room.id)
            .eq('cycle_key', previousCycleKey)
            .then(() => {}, () => {});
        }
      }

      function tickPomodoro() {
        cycleState = getCycleState();
        phaseEl.textContent = cycleState.isBreak ? 'BREAK' : 'FOCUS';
        pomodoroCard.classList.toggle('is-break', cycleState.isBreak);
        pomodoroTimerEl.textContent = fmtClock(cycleState.remaining);
        pomodoroLabelEl.textContent = cycleState.isBreak ? 'back to focus in' : 'until break';

        if (cycleState.isBreak !== lastIsBreak) {
          if (cycleState.isBreak) {
            enterBreak();
          } else {
            enterFocus(lastCycleKey);
          }
          lastIsBreak = cycleState.isBreak;
          lastCycleKey = cycleState.cycleKey;
        }
      }

      tickPomodoro();
      if (cycleState.isBreak) enterBreak();
      setInterval(tickPomodoro, 1000);

      // ── Personal timer + leave ────────────────────────────────────
      const startedAt = Date.now();
      const timerEl = document.getElementById('timer');
      function tick() {
        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }
      tick();
      const timerInterval = setInterval(tick, 1000);

      let studySaved = false;
      function saveStudyTime() {
        if (studySaved) return;
        studySaved = true;
        const elapsedSeconds = (Date.now() - startedAt) / 1000;
        addStudiedSeconds(elapsedSeconds);
        supabase.from('pb_room_sessions').update({
          left_at: new Date().toISOString(),
          duration_seconds: Math.round(elapsedSeconds),
        }).eq('id', sessionId).then(() => {}, () => {});
        supabase.from('pb_events').insert({
          user_id: deviceId,
          device_session_id: getDeviceSessionId(),
          event_name: 'room_leave',
          room_id: room.id,
          properties: { duration_seconds: Math.round(elapsedSeconds) },
        }).then(() => {}, () => {});
      }

      function leave() {
        saveStudyTime();
        clearInterval(timerInterval);
        channel.untrack();
        supabase.removeChannel(channel);
        location.href = '/rooms/';
      }

      document.getElementById('leaveBtn').addEventListener('click', leave);
      window.addEventListener('pagehide', saveStudyTime);
    </script>
  </body>
</html>
