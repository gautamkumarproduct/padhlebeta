<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f4a"/>
      <stop offset="50%" stop-color="#1f2e6a"/>
      <stop offset="100%" stop-color="#2c3f86"/>
    </linearGradient>
    <radialGradient id="lamp2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffcf7a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf9660"/>
      <stop offset="100%" stop-color="#a06a3c"/>
    </linearGradient>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="bokehBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky2)"/>

  <!-- soft distant moon glow, off to the side -->
  <circle cx="220" cy="180" r="150" fill="#fff6d8" opacity="0.12" filter="url(#soft2)"/>
  <circle cx="220" cy="180" r="46" fill="#fdf2cf" opacity="0.85"/>

  <!-- floating magical bokeh particles -->
  <g filter="url(#bokehBlur)">
    <circle cx="480" cy="160" r="10" fill="#ffe9b0" opacity="0.5"/>
    <circle cx="640" cy="90" r="6" fill="#ffe9b0" opacity="0.4"/>
    <circle cx="1100" cy="150" r="14" fill="#ffcf7a" opacity="0.35"/>
    <circle cx="1300" cy="260" r="8" fill="#ffe9b0" opacity="0.4"/>
    <circle cx="900" cy="230" r="7" fill="#fff6d8" opacity="0.45"/>
  </g>
  <g fill="#fff6d8">
    <circle cx="150" cy="380" r="2.2"/>
    <circle cx="1400" cy="90" r="2.4"/>
    <circle cx="1500" cy="340" r="2"/>
    <circle cx="60" cy="120" r="2"/>
  </g>

  <!-- warm lamp glow, big and close -->
  <ellipse cx="740" cy="560" rx="440" ry="360" fill="url(#lamp2)" filter="url(#bokehBlur)"/>

  <!-- desk surface, close up, rounded front edge -->
  <rect x="0" y="700" width="1600" height="300" fill="url(#desk2)"/>
  <rect x="0" y="694" width="1600" height="16" rx="8" fill="#e6b478"/>

  <!-- rounded desk lamp, closer -->
  <g>
    <ellipse cx="716" cy="778" rx="34" ry="11" fill="#7a5230"/>
    <rect x="702" y="700" width="24" height="80" rx="12" fill="#7a5230"/>
    <path d="M716 702 Q780 660 840 642 Q862 636 868 658 Q872 678 848 682 Q788 698 736 730 Z" fill="#ffe0a0"/>
    <circle cx="810" cy="666" r="34" fill="#fff6d8" opacity="0.9"/>
  </g>

  <!-- open notebook, close-up, rounded corners, hand-drawn feel -->
  <path d="M400 850 Q 560 820 720 848 L 735 918 Q 570 892 415 920 Z" fill="#fdf6e3"/>
  <path d="M720 848 Q 900 818 1080 846 L 1065 918 Q 890 892 735 918 Z" fill="#f3ead0"/>
  <g stroke="#d9cba0" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="450" y1="862" x2="660" y2="846"/>
    <line x1="452" y1="884" x2="662" y2="868"/>
    <line x1="454" y1="906" x2="640" y2="892"/>
    <line x1="780" y1="854" x2="1000" y2="838"/>
    <line x1="782" y1="876" x2="1000" y2="860"/>
  </g>

  <!-- rounded pencil resting on notebook -->
  <g transform="rotate(-10 950 830)">
    <rect x="850" y="822" width="200" height="16" rx="8" fill="#ffb04d"/>
    <rect x="1044" y="822" width="18" height="16" rx="6" fill="#6b5138"/>
    <polygon points="1050,822 1062,822 1050,838" fill="#f6c9a0"/>
  </g>

  <!-- rounded mug with heart-shaped steam -->
  <g>
    <path d="M300 780 q0 -18 20 -18 h60 q20 0 20 18 v40 q0 30 -50 30 q-50 0 -50 -30 Z" fill="#ff9fd6"/>
    <path d="M400 792 q28 -4 28 20 q0 24 -28 20" fill="none" stroke="#ff9fd6" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="330" cy="780" rx="40" ry="9" fill="#ffd3ec"/>
    <path d="M320 745 q-10 -14 0 -26 q10 12 0 26 Z" fill="#fff" opacity="0.7"/>
    <path d="M345 738 q-10 -14 0 -26 q10 12 0 26 Z" fill="#fff" opacity="0.6"/>
  </g>

  <!-- stack of chunky books, right foreground -->
  <g>
    <rect x="1160" y="792" width="230" height="36" rx="16" fill="#ff9f6b"/>
    <rect x="1140" y="754" width="260" height="36" rx="16" fill="#6fbfff"/>
    <rect x="1172" y="716" width="204" height="36" rx="16" fill="#ffe27a"/>
    <rect x="1150" y="678" width="240" height="36" rx="16" fill="#8bd694"/>
  </g>

  <!-- tiny sleeping cat paw peeking from the right edge -->
  <ellipse cx="1550" cy="960" rx="60" ry="34" fill="#e6a15c"/>
</svg>
