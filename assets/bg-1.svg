<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2456"/>
      <stop offset="45%" stop-color="#20306e"/>
      <stop offset="100%" stop-color="#2c3f86"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffcf7a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a53"/>
      <stop offset="100%" stop-color="#a06a3c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233268"/>
      <stop offset="100%" stop-color="#2c3f86"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- fluffy painterly clouds -->
  <g fill="#3a4d92" opacity="0.55" filter="url(#soft)">
    <ellipse cx="220" cy="150" rx="160" ry="46"/>
    <ellipse cx="340" cy="130" rx="110" ry="36"/>
    <ellipse cx="1300" cy="230" rx="180" ry="50"/>
    <ellipse cx="1180" cy="210" rx="120" ry="38"/>
  </g>

  <!-- moon -->
  <circle cx="1310" cy="150" r="130" fill="url(#moonGlow)"/>
  <circle cx="1310" cy="150" r="64" fill="#fff8e2"/>
  <circle cx="1290" cy="130" r="10" fill="#f3e6bf" opacity="0.6"/>
  <circle cx="1330" cy="165" r="7" fill="#f3e6bf" opacity="0.5"/>
  <circle cx="1305" cy="175" r="5" fill="#f3e6bf" opacity="0.5"/>

  <!-- twinkly stars -->
  <g fill="#fff6d8">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="180" cy="260" r="2.4"/>
    <circle cx="520" cy="80" r="2.6"/>
    <circle cx="700" cy="150" r="2"/>
    <circle cx="900" cy="60" r="2.8"/>
    <circle cx="1000" cy="330" r="2"/>
    <circle cx="60" cy="330" r="2.2"/>
    <circle cx="1520" cy="120" r="2.4"/>
    <circle cx="1460" cy="330" r="2"/>
  </g>

  <!-- distant rolling hill silhouette -->
  <path d="M0 430 Q 250 370 500 420 T 1000 410 T 1600 440 V 620 H 0 Z" fill="#1c2a5c" opacity="0.65"/>

  <!-- back wall of the cozy room -->
  <rect x="0" y="560" width="1600" height="440" fill="url(#wall)"/>

  <!-- round window -->
  <circle cx="330" cy="330" r="150" fill="#161f45"/>
  <circle cx="330" cy="330" r="150" fill="none" stroke="#4a5aa0" stroke-width="14"/>
  <circle cx="330" cy="330" r="66" fill="#fdeec2" opacity="0.85"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="280" cy="290" r="2"/>
    <circle cx="380" cy="300" r="1.6"/>
    <circle cx="300" cy="370" r="1.8"/>
  </g>

  <!-- hanging plant, rounded leafy blobs -->
  <g>
    <line x1="1420" y1="0" x2="1420" y2="120" stroke="#6b5138" stroke-width="4"/>
    <ellipse cx="1420" cy="120" rx="20" ry="14" fill="#6b5138"/>
    <g fill="#6fbf7a">
      <ellipse cx="1380" cy="150" rx="46" ry="30" transform="rotate(-20 1380 150)"/>
      <ellipse cx="1440" cy="160" rx="52" ry="32" transform="rotate(14 1440 160)"/>
      <ellipse cx="1410" cy="190" rx="40" ry="26" transform="rotate(-4 1410 190)"/>
    </g>
    <g fill="#8bd694">
      <ellipse cx="1390" cy="145" rx="18" ry="10" transform="rotate(-20 1390 145)"/>
      <ellipse cx="1435" cy="155" rx="20" ry="10" transform="rotate(14 1435 155)"/>
    </g>
  </g>

  <!-- bookshelf, chunky rounded books -->
  <g>
    <rect x="60" y="480" width="240" height="220" rx="12" fill="#233268"/>
    <rect x="76" y="500" width="208" height="16" rx="8" fill="#3a4d92"/>
    <g>
      <rect x="90" y="522" width="20" height="80" rx="8" fill="#ffb04d"/>
      <rect x="114" y="522" width="18" height="80" rx="8" fill="#ff7d7d"/>
      <rect x="136" y="526" width="22" height="76" rx="8" fill="#6fbfff"/>
      <rect x="162" y="522" width="18" height="80" rx="8" fill="#ffe27a"/>
      <rect x="184" y="528" width="20" height="74" rx="8" fill="#8bd694"/>
      <rect x="208" y="522" width="18" height="80" rx="8" fill="#ff9fd6"/>
      <rect x="230" y="524" width="22" height="78" rx="8" fill="#ffb04d"/>
      <rect x="256" y="522" width="18" height="80" rx="8" fill="#6fbfff"/>
    </g>
  </g>

  <!-- desk, rounded corners -->
  <rect x="0" y="760" width="1600" height="240" rx="0" fill="url(#desk)"/>
  <rect x="0" y="754" width="1600" height="16" rx="8" fill="#e0a868"/>

  <!-- warm lamp glow pooling on desk -->
  <ellipse cx="1060" cy="740" rx="300" ry="220" fill="url(#lamp)" filter="url(#softer)"/>

  <!-- cute rounded desk lamp -->
  <g>
    <ellipse cx="1080" cy="838" rx="30" ry="10" fill="#7a5230"/>
    <rect x="1070" y="770" width="20" height="70" rx="10" fill="#7a5230"/>
    <path d="M1080 772 Q1130 740 1180 726 Q1200 720 1206 740 Q1210 758 1188 762 Q1140 774 1096 796 Z" fill="#ffcf7a"/>
    <circle cx="1160" cy="748" r="30" fill="#fff3cf" opacity="0.9"/>
  </g>

  <!-- stack of chunky rounded books on desk -->
  <g>
    <rect x="1230" y="882" width="150" height="30" rx="14" fill="#ff9f6b"/>
    <rect x="1218" y="854" width="174" height="30" rx="14" fill="#6fbfff"/>
    <rect x="1236" y="826" width="138" height="30" rx="14" fill="#ffe27a"/>
  </g>

  <!-- open notebook -->
  <path d="M760 900 Q 860 884 960 902 L 970 942 Q 862 928 770 944 Z" fill="#fdf6e3"/>
  <path d="M960 902 Q 1060 886 1150 902 L 1140 944 Q 1050 930 970 942 Z" fill="#f3ead0"/>

  <!-- chibi-style student silhouette: round head, hoodie, hunched over notebook -->
  <g transform="translate(-330, 40)">
    <!-- hoodie body -->
    <path d="M660 1000 C650 900 670 830 730 815 C725 780 745 748 795 748
             C845 748 870 780 862 818 C915 832 935 875 930 920
             L930 1000 Z" fill="#5c6bb0"/>
    <!-- hood trim -->
    <path d="M730 815 C725 780 745 748 795 748 C845 748 870 780 862 818"
          fill="none" stroke="#4a5896" stroke-width="10" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="800" cy="800" r="58" fill="#f6c9a0"/>
    <!-- hair -->
    <path d="M742 782 C742 740 774 712 806 712 C842 712 862 742 860 776
              C846 758 826 748 806 750 C780 752 758 764 742 782 Z" fill="#3c2b22"/>
    <!-- resting arm + hand holding pencil -->
    <path d="M735 828 C712 842 700 868 712 892 C722 912 752 916 766 900
             C776 888 768 868 752 856 C744 850 740 838 735 828 Z" fill="#f6c9a0"/>
    <rect x="748" y="880" width="70" height="10" rx="5" fill="#ffcf7a" transform="rotate(-18 748 880)"/>
    <!-- warm rim light on the character from the lamp -->
    <path d="M862 818 C915 832 935 875 930 920 L930 1000 L905 1000 L900 918 C896 886 884 852 850 826 Z"
          fill="#ffcf7a" opacity="0.3"/>
  </g>

  <!-- sleepy cat curled up beside the books -->
  <g transform="translate(-40, 0)">
    <ellipse cx="1440" cy="948" rx="70" ry="38" fill="#e6a15c"/>
    <path d="M1400 928 L1392 902 L1412 918 Z" fill="#e6a15c"/>
    <path d="M1470 928 L1480 902 L1458 918 Z" fill="#e6a15c"/>
    <path d="M1470 950 Q1500 940 1498 916" stroke="#e6a15c" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
