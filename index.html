<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PadhleBeta — Study motivation, non-stop</title>
    <meta
      name="description"
      content="Non-stop Hindi motivational songs to study, focus and grind with. Padhle beta, kar ke dikha. Press play."
    />
    <meta name="theme-color" content="#0a1430" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PadhleBeta" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="PadhleBeta" />
    <meta property="og:description" content="Non-stop Hindi motivational songs to study, focus and grind with." />
    <meta property="og:url" content="https://padhlebeta.live" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PadhleBeta" />
    <meta name="twitter:description" content="Non-stop Hindi motivational songs to study, focus and grind with." />

    <link rel="canonical" href="https://padhlebeta.live" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Yatra+One&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles.css" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CFKL02YN12"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-CFKL02YN12');
    </script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__layer bg__layer--1 is-active"></div>
      <div class="bg__layer bg__layer--2"></div>
      <div class="bg__scrim"></div>
    </div>

    <div id="yt-player" class="yt-host"></div>

    <main>
      <div class="topbar">
        <span class="clock" id="clock"></span>
        <span class="presence">
          <span class="presence__dot"></span>
          <span class="presence__count" id="listeners">612</span>
          <span class="presence__label">studying now</span>
        </span>
        <span class="links"></span>
      </div>

      <h1 class="logo">
        <span class="logo__line">पढ़ले</span>
        <span class="logo__line">बेटा</span>
      </h1>

      <div class="dock">
        <p class="bumper">
          <span class="bumper__text" id="bumperText"></span>
          <button class="bumper__next" id="bumperNext" type="button" aria-label="Next line">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          </button>
        </p>

        <div class="list" id="list">
          <ol id="listItems"></ol>
        </div>

        <div class="player" id="player">
          <div class="disc">
            <div class="disc__ring">
              <img class="disc__art" id="cover" src="" alt="" />
            </div>
            <div class="disc__hub"></div>
          </div>

          <div class="meta">
            <p class="meta__title" id="title">Loading playlist…</p>
            <p class="meta__artist" id="artist">padhlebeta.live</p>

            <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="seek__rail">
                <div class="seek__fill" id="seekFill"></div>
              </div>
              <div class="seek__knob" id="seekKnob"></div>
            </div>
            <div class="time">
              <span id="tCur">0:00</span> / <span id="tDur">0:00</span>
            </div>
          </div>

          <div class="controls">
            <button class="btn btn--toggle is-on" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>
            <button class="btn" id="prev" type="button" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 18L9 12l11-6v12z"></path></svg>
            </button>
            <button class="btn btn--play" id="play" type="button" aria-label="Play" disabled>
              <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
              <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
            </button>
            <button class="btn" id="next" type="button" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM4 6l11 6L4 18V6z"></path></svg>
            </button>
            <button class="btn btn--toggle" id="listBtn" type="button" aria-label="Playlist" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
